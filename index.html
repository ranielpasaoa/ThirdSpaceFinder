<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Third Space Finder</title>
    <script src="api.js" defer></script>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h3> <a href = "index.html" class = "homeButton">Third Space Finder</a></h3>
        <input id = "searchBar" type="text" placeholder="Search for a third space...">
        <div class="headerButtons">
            <div class="filterContainer">
                <button id="filterButton">Filter</button>
                <div id="filterMenu" class="filterMenu">
                    <button class="filterOption" data-type="Museum"><span class="checkbox">☐</span>Museums</button>
                    <button class="filterOption" data-type="Restaurant"><span class="checkbox">☐</span>Restaurants</button>
                    <button class="filterOption" data-type="Pool"><span class="checkbox">☐</span> Pools</button>
                    <button class="filterOption" data-type="Park"><span class="checkbox">☐</span>Parks</button>
                    <button class="filterOption" data-type="Library"><span class="checkbox">☐</span>Libraries</button>
                </div>
            </div>
                <div id = "AdressDropdown">
                    <input id = "UserAddress" placeholder="Input Address for Nearby Third Spaces">
                </div>
            <a>About Us</a>
        </div>
    </header>
    <main>
        <section id="searchResults">
            <label>Amount of Results:</label>
            <input id="slider" type="range" min="10" max="75" value="10">
        </section>
         <div id = "homeContent">
        <div class="leftside">
            <!-- google maps api placeholder -->
            <img src="https://cdn.corenexis.com/f/K4jBoEAMCtR.png" height="400px" width="500px">
            <div class="cards filterScroll" id="results">
                <a href="https://www.wikipedia.org" class="card">Museums</a>
                <a href="https://www.wikipedia.org" class="card">Restaurants</a>
                <a href="https://www.wikipedia.org" class="card">Pools</a>
                <a href="https://www.wikipedia.org" class="card">Parks</a>
                <a href="https://www.wikipedia.org" class="card">placeholder button</a>
                <a href="https://www.wikipedia.org" class="card">placeholder button</a>
                <a href="https://www.wikipedia.org" class="card">placeholder button</a>
            </div>
        </div>
        <div class="rightside">
            <a href="https://www.youtube.com" class="rcard"></a>
        </div>
        </div>
    </main>
</body>

</html>
